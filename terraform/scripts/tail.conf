<source>
  @type tail
  path /var/log/app/gcp-logging.*.json
  pos_file /var/log/google-fluentd/app-logging.pos
  tag app.logs
  <parse>
    @type json
  </parse>
</source>

# 解析 event 字段中的 JSON
<filter app.logs>
  @type parser
  key_name event
  <parse>
    @type json
  </parse>
  replace_invalid_sequence true
  reserve_data true
</filter>

# 转换为 GCP Cloud Logging 格式
<filter app.logs>
  @type record_transformer
  enable_ruby true
  <record>
    severity ${
      sev = record.dig("event", "severity").to_s.upcase
      case sev
      when "ERROR", "FATAL"
        "ERROR"
      when "WARN"
        "WARNING"
      when "INFO"
        "INFO"
      when "DEBUG"
        "DEBUG"
      when "TRACE"
        "DEBUG"
      else
        "DEFAULT"
      end
    }
    message ${record.dig("event", "message")}
    logging.googleapis.com/labels {
      "application": "${record["source"]}"
    }
  </record>
</filter>