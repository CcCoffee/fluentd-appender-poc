<source>
  @type tail
  path /var/log/app/gcp-logging.*.json
  pos_file /var/log/google-fluentd/app-logging.pos
  tag app.logs
  <parse>
    @type json
  </parse>
</source>

# 解析 event 字段中的 JSON
<filter mylogs>
  @type record_transformer
  enable_ruby true
  <record>
    # 处理多重转义，将 event 字符串转换为有效的 JSON
    clean_event ${
      begin
        # 1. 移除多余的转义
        clean_str = record["event"].gsub(/\\\\/, '\\')
        # 2. 解析 JSON
        event_obj = JSON.parse(clean_str)
        # 3. 返回需要的字段
        {
          'severity' => event_obj['severity'],
          'logger' => event_obj['logger'],
          'thread' => event_obj['thread'],
          'message' => event_obj['message'],
          'properties' => event_obj['properties']
        }
      rescue => e
        $log.warn "Failed to parse event: #{e.message}"
        {'error' => e.message, 'raw' => record["event"]}
      end
    }
  </record>
  remove_keys event
</filter>

# 转换为 GCP Cloud Logging 格式
<filter app.logs>
  @type record_transformer
  enable_ruby true
  <record>
    severity ${
      sev = record.dig("event", "severity").to_s.upcase
      case sev
      when "ERROR", "FATAL"
        "ERROR"
      when "WARN"
        "WARNING"
      when "INFO"
        "INFO"
      when "DEBUG"
        "DEBUG"
      when "TRACE"
        "DEBUG"
      else
        "DEFAULT"
      end
    }
    message ${record.dig("event", "message")}
    logging.googleapis.com/labels {
      "application": "${record["source"]}"
    }
  </record>
</filter>