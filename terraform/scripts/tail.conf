<source>
  @type tail
  path /var/log/app/gcp-logging.*.json
  pos_file /var/log/app/gcp-logging.pos
  tag gcp.logs
  <parse>
    @type json
  </parse>
</source>

# 解析 event 字段中的 JSON
<filter gcp.logs>
  @type parser
  key_name event
  <parse>
    @type json
  </parse>
  replace_invalid_sequence true
  reserve_data true
</filter>

# 映射字段和转换时间戳
<filter gcp.logs>
  @type record_transformer
  enable_ruby true
  <record>
    # 映射日志级别
    severity ${
      sev = record.dig("event", "severity").to_s.upcase
      case sev
      when "ERROR", "FATAL"
        "ERROR"
      when "WARN"
        "WARNING"
      when "INFO"
        "INFO"
      when "DEBUG"
        "DEBUG"
      when "TRACE"
        "DEBUG"
      else
        "DEFAULT"
      end
    }
    
    # 日志内容
    message ${record.dig("event", "message")}
    
    # 转换 Unix 时间戳（包含毫秒）
    timestampSeconds ${
      begin
        time_str = record["time"].to_s
        if time_str.include?(".")
          seconds, msecs = time_str.split(".")
          Time.at(seconds.to_i, msecs.to_i * 1000).utc.iso8601(3)
        else
          Time.at(time_str.to_i).utc.iso8601(3)
        end
      rescue
        Time.now.utc.iso8601(3)
      end
    }
    
    # 使用 source 作为应用名称
    logging.googleapis.com/labels {
      "application": "${record["source"]}"
    }
  </record>
</filter>

# 输出到 GCP Cloud Logging
<match gcp.logs>
  @type google_cloud_logging
  
  # GCP 项目配置
  project_id your-project-id
  # 使用应用默认凭据
  auth_method application_default
  
  # 资源配置
  resource_type "generic_task"
  resource_labels {
    "project_id": "your-project-id",
    "location": "global",
    "namespace": "default",
    "job": "${tag}"
  }

  # 日志配置
  insert_timestamp_key timestampSeconds
  use_severity true
  severity_key severity
  
  # 缓冲配置
  <buffer>
    @type memory
    flush_interval 5s
    chunk_limit_size 1m
    total_limit_size 10m
    retry_max_times 5
    retry_wait 1s
  </buffer>
</match>